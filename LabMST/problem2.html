<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 2 (DOM)</title>
</head>
<body>
    <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea eligendi officia quibusdam, illum minima quisquam amet nesciunt, impedit totam vitae harum maiores voluptate aliquid esse obcaecati, voluptatibus doloribus corporis! Consequatur.</p>

    <button id="btn">Click Me!</button>

    <script>
        document.getElementById("btn").addEventListener("click", function(){
            document.getElementById("para").innerText = "Welcome to JavaScript DOM Manipulation";
            document.getElementById("para").style.color = "blue";
        });
    </script>

    
</body>
</html>
